<!doctype html>
<!--
  TODO(placeholder): native app offline / error screen.
  Shown by Capacitor (server.errorPath) when https://www.brickfi.in/app can't load.
  Plugins aren't available here on Android, so keep it plain HTML/CSS/JS.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brickfi</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        background: #f5f5f5;
        color: #2e3e4e;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #666; margin: 0 0 24px; line-height: 1.5; }
      button {
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: #2e3e4e;
        border: 0;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="window.location.replace('https://www.brickfi.in/app')">Try again</button>
  </body>
</html>
